name: Run commands when issues are labeled or comments added
on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Actions
        uses: actions/checkout@6ccd57f4c5d15bdc2fef309bd9fb6cc9db2ef1c6
        with:
          repository: "oam-dev/kubevela-github-actions"
          path: ./actions
          ref: v0.4.2
      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: ./actions/package-lock.json
      - name: Install Dependencies
        run: npm ci --production --prefix ./actions
      - name: Run Commands
        uses: ./actions/commands
        with:
          token: ${{secrets.VELA_BOT_TOKEN}}
          configPath: issue-commands

  backport:
    runs-on: ubuntu-22.04
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/backport')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Extract Command
        id: command
        uses: xt0rted/slash-command-action@bf51f8f5f4ea3d58abc7eca58f77104182b23e88
        with:
          repo-token: ${{ secrets.VELA_BOT_TOKEN }}
          command: backport
          reaction: "true"
          reaction-type: "eyes"
          allow-edits: "false"
          permission-level: write
      - name: Handle Command
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          VERSION: ${{ steps.command.outputs.command-arguments }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION
            let label = "backport release-" + version
            if (version.includes("release")) {
              label = "backport " + version
            }
            // Add our backport label.
            await github.rest.issues.addLabels({
              // Every pull request is an issue, but not every issue is a pull request.
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [label]
            })
            console.log("Added '" + label + "' label.")
      - name: Checkout
        uses: actions/checkout@6ccd57f4c5d15bdc2fef309bd9fb6cc9db2ef1c6
        with:
          fetch-depth: 0
      # Same sign-off committer as back-port.yml; the DCO check needs it to match.
      - name: Committer from sign-off
        id: committer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid // empty')
          re='^([^<>]+) <([^<>[:space:]]+@[^<>[:space:]]+)>[[:space:]]*$'
          line=""
          if [[ -n "$sha" ]]; then
            # The step runs under -eo pipefail; no valid sign-off means the fallback, not a failure.
            line=$(git log -1 --format=%B "$sha" | sed -n 's/^Signed-off-by: //p' | grep -E -m1 "$re" || true)
          fi
          if [[ "$line" =~ $re ]]; then
            echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "email=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable Signed-off-by on the merged commit; committing as github-actions[bot]"
          fi
      - name: Open Backport PR
        uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_workspace: ${{ github.workspace }}
          git_committer_name: ${{ steps.committer.outputs.name || 'github-actions[bot]' }}
          git_committer_email: ${{ steps.committer.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com' }}

  retest:
    runs-on: ubuntu-22.04
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/retest')
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Retest the current pull request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          PULL_REQUEST_ID: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pull_request_id = process.env.PULL_REQUEST_ID
            const comment_id = process.env.COMMENT_ID
            const comment_body = process.env.COMMENT_BODY
            console.log("retest pr: #" + pull_request_id + " comment: " + comment_body)
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_request_id,
            })
            console.log("pr: " + JSON.stringify(pr))
            const action = comment_body.split(" ")[0]
            let workflow_ids = comment_body.split(" ").slice(1).filter(line => line.length > 0).map(line => line + ".yml")
            if (workflow_ids.length == 0) workflow_ids = ["staticcheck.yml", "server-test.yml", "arm64-build-test.yml"]
            for (let i = 0; i < workflow_ids.length; i++) {
              const workflow_id = workflow_ids[i]
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow_id,
                head_sha: pr.head.sha,
              })
              console.log("runs for " + workflow_id + ": ", JSON.stringify(runs))
              runs.workflow_runs.forEach((workflow_run) => {
                if (workflow_run.status === "in_progress") return
                let handler = github.rest.actions.reRunWorkflow
                if (action === "/retest-failed") handler = github.rest.actions.reRunWorkflowFailedJobs
                handler({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: workflow_run.id
                })
              })
            }
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment_id,
              content: "eyes",
            });

